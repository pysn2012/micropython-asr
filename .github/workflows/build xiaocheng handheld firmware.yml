name: build xiaocheng handheld firmware

# 小程 ESP32S3 掌机专用构建（16MB Flash + Octal PSRAM + ES7210/ES8311 共享I2S音频）
# 与主工作流（build mpy with asr）分开，便于掌机单独触发和产物管理

# 仅手动触发
on:
  workflow_dispatch:

# 并发控制：同一分支只保留最新一次
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MICROPYTHON_DIR: ${{ github.workspace }}
  ESP_IDF_DIR: ${{ github.workspace }}/esp-idf
  ESP_SR_COMPONENT_DIR: ${{ github.workspace }}/esp-sr
  ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  # esp-idf版本，与主工作流一致（v5.5.6 与 ESP-VISION 官方编译矩阵一致）
  ESP_IDF_VERSION: v5.5.6

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 小程掌机：16MB Flash（N16R8），全功能含 TTS
        include:
          - board: ESP32_GENERIC_S3_XC16M
            variant: SPIRAM_OCT
            flash_size: 16

    steps:
      # 1. 检出当前仓库
      - name: 检出当前仓库
        uses: actions/checkout@v4

      # 2. 缓存 ESP-IDF（只缓存工具链，不缓存源码——否则缓存命中会用旧源码覆盖新提交）
      - name: 缓存 ESP-IDF
        id: cache_all
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ESP_IDF_DIR }}
            ~/.espressif/
            ~/.cache/pip/
          key: mpy-asr-idf-${{ env.ESP_IDF_VERSION }}

      # 3. 克隆 esp-sr（必须无条件执行：不进缓存，IDF 缓存命中时本步骤也不能跳过）
      - name: 克隆 esp-sr
        run: |
          # esp-sr 仓库 v2.1 起不再打 git tag，版本只发 Component Registry，
          # master 即最新发布版（当前 2.6.1）
          git clone --depth 1 https://github.com/espressif/esp-sr.git \
            ${{ env.ESP_SR_COMPONENT_DIR }}

      # 4. 安装系统依赖（仅在缓存未命中时）
      - name: 安装系统依赖
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      # 5. 初始化MicroPython
      - name: 初始化MicroPython
        run: |
          cd ${{ env.MICROPYTHON_DIR }}
          git submodule update --init --depth 1
          make -C mpy-cross

      # 6. 克隆并配置 ESP-IDF（仅在缓存未命中时）
      - name: 克隆并配置 ESP-IDF
        if: steps.cache_all.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} \
            https://github.com/espressif/esp-idf.git ${{ env.ESP_IDF_DIR }}
          git -C ${{ env.ESP_IDF_DIR }} submodule update --init --recursive --filter=tree:0
          ${{ env.ESP_IDF_DIR }}/install.sh esp32,esp32s3,esp32c3

      # 7. 编译固件
      - name: 编译固件
        run: |
          source ${{ env.ESP_IDF_DIR }}/export.sh
          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          make BOARD=${{ matrix.board }} \
               BOARD_VARIANT=${{ matrix.variant }} \
               FLASH_SIZE=${{ matrix.flash_size }}MB \
               USER_C_MODULES="${{ github.workspace }}/examples/usercmodule/asr/micropython.cmake" \
               -j$(nproc)

      # 8. 构建失败时打印详细日志（idf.py 的真实错误在 log/ 目录里，默认不显示）
      - name: 失败时打印构建日志
        if: failure()
        run: |
          cd ${{ env.MICROPYTHON_DIR }}/ports/esp32
          echo "======== 错误行检索 ========"
          grep -n -iE "error:|FAILED:|fatal|Killed|undefined|No such file" \
            build-*/log/idf_py_*output_* || echo "(日志中未匹配到错误关键词)"
          echo "======== 各日志文件尾部(400行) ========"
          for f in build-*/log/idf_py_*output_*; do
            if [ -f "$f" ]; then
              echo "---- $f ----"
              tail -n 400 "$f" || true
            fi
          done

      # 9. 重命名并收集固件
      - name: 重命名并收集固件
        run: |
          mkdir -p ${{ env.ARTIFACTS_DIR }}
          BOARD_NAME="${{ matrix.board }}"
          [[ -n "${{ matrix.variant }}" ]] && BOARD_NAME+="-${{ matrix.variant }}"
          FW_PATH="${{ env.MICROPYTHON_DIR }}/ports/esp32/build-${BOARD_NAME}/firmware.bin"
          OUT_NAME="${{ matrix.board }}${{ matrix.variant && format('_{0}', matrix.variant) || '' }}_${{ matrix.flash_size }}MB.bin"

          if [[ -f "$FW_PATH" ]]; then
            cp "$FW_PATH" "${{ env.ARTIFACTS_DIR }}/$OUT_NAME"
          else
            echo "Firmware not found at $FW_PATH"
            exit 1
          fi

          # 收集 esp-sr 模型包（srmodels_bin 目标随主构建自动生成）
          SR_PATH="${{ env.MICROPYTHON_DIR }}/ports/esp32/build-${BOARD_NAME}/srmodels/srmodels.bin"
          if [[ -f "$SR_PATH" ]]; then
            cp "$SR_PATH" "${{ env.ARTIFACTS_DIR }}/srmodels.bin"
            ls -la "${{ env.ARTIFACTS_DIR }}/"
          else
            echo "srmodels.bin not found at $SR_PATH"
            find ${{ env.MICROPYTHON_DIR }}/ports/esp32/build-${BOARD_NAME} -name "*.bin" | head -20
            exit 1
          fi

      # 10. 上传构建产物
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mpy_asr-${{ matrix.board }}${{ matrix.variant && format('_{0}', matrix.variant) || '' }}_${{ matrix.flash_size }}MB
          path: ${{ env.ARTIFACTS_DIR }}/*.bin
